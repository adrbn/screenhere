name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the build to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test and publish
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:TAG) { ./windows/scripts/publish.ps1 -Version $env:TAG.TrimStart('v') }
          else { ./windows/scripts/publish.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenHere-Windows
          path: windows/dist/ScreenHere-Windows.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG windows/dist/ScreenHere-Windows.exe --clobber
  # The README's pictures of the Windows app are drawn by the app itself, so
  # they need a Windows machine. This is that machine.
  shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Draw the pictures
        shell: pwsh
        run: |
          dotnet build windows/ScreenHere -c Debug --nologo -v q
          $exe = Get-ChildItem windows/ScreenHere/bin/Debug -Recurse -Filter ScreenHere.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '--shots', "$env:RUNNER_TEMP\shots" -Wait
          Get-ChildItem "$env:RUNNER_TEMP\shots"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shots
          path: ${{ runner.temp }}/shots

  # Two copies, the newer one started over the older: the new one must end up
  # the one running. It needs two builds and a real Windows session, so it
  # lives here rather than in the unit tests.
  takeover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: An older copy, then a newer one
        shell: pwsh
        run: |
          ./windows/scripts/publish.ps1 -Version 1.0.0
          Copy-Item windows/dist/ScreenHere-Windows.exe "$env:RUNNER_TEMP\old.exe"
          ./windows/scripts/publish.ps1 -Version 1.0.1
          Copy-Item windows/dist/ScreenHere-Windows.exe "$env:RUNNER_TEMP\new.exe"

          Start-Process "$env:RUNNER_TEMP\old.exe"; Start-Sleep 12
          "running: " + (Get-Content "$env:APPDATA\ScreenHere\running" -ErrorAction SilentlyContinue)
          Start-Process "$env:RUNNER_TEMP\new.exe"; Start-Sleep 20

          $alive = @(Get-Process ScreenHere -ErrorAction SilentlyContinue)
          $alive | ForEach-Object { "$($_.Id) $($_.MainModule.FileVersionInfo.FileVersion) $($_.MainModule.FileName)" }
          $versions = $alive | ForEach-Object { $_.MainModule.FileVersionInfo.FileVersion }
          Get-Process ScreenHere -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($versions -notcontains '1.0.1.0') { throw "the newer copy did not take over: $($versions -join ', ')" }
          "took over"
