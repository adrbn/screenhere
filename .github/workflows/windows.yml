name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the build to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test and publish
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:TAG) { ./windows/scripts/publish.ps1 -Version $env:TAG.TrimStart('v') }
          else { ./windows/scripts/publish.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenHere-Windows
          path: windows/dist/ScreenHere-Windows.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG windows/dist/ScreenHere-Windows.exe --clobber
  # The README's pictures of the Windows app are drawn by the app itself, so
  # they need a Windows machine. This is that machine.
  shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Draw the pictures
        shell: pwsh
        run: |
          dotnet build windows/ScreenHere -c Debug --nologo -v q
          $exe = Get-ChildItem windows/ScreenHere/bin/Debug -Recurse -Filter ScreenHere.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '--shots', "$env:RUNNER_TEMP\shots" -Wait
          Get-ChildItem "$env:RUNNER_TEMP\shots"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shots
          path: ${{ runner.temp }}/shots

  # Two copies, the newer one started over the older: the new one must end up
  # the one running. It needs two builds and a real Windows session, so it
  # lives here rather than in the unit tests.
  takeover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: An older copy, then a newer one
        shell: pwsh
        run: |
          # Each one keeps the app's own name, or Get-Process would not find it.
          foreach ($v in '1.0.0', '1.0.1') {
            ./windows/scripts/publish.ps1 -Version $v
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\$v" | Out-Null
            Copy-Item windows/dist/ScreenHere-Windows.exe "$env:RUNNER_TEMP\$v\ScreenHere.exe"
          }

          function Show($when) {
            "--- $when"
            Get-Process ScreenHere -ErrorAction SilentlyContinue |
              ForEach-Object { "    $($_.Id) $($_.MainModule.FileVersionInfo.FileVersion) $($_.MainModule.FileName)" }
            "    mark: " + (Get-Content "$env:APPDATA\ScreenHere\running" -ErrorAction SilentlyContinue)
          }

          Start-Process "$env:RUNNER_TEMP\1.0.0\ScreenHere.exe"; Start-Sleep 15
          Show "the older copy alone"
          Start-Process "$env:RUNNER_TEMP\1.0.1\ScreenHere.exe"; Start-Sleep 30
          Show "after the newer one started"

          foreach ($log in 'errors.log', 'update.log') {
            $path = "$env:APPDATA\ScreenHere\$log"
            if (Test-Path $path) { "--- $log"; Get-Content $path | Select-Object -Last 40 }
          }

          $alive = @(Get-Process ScreenHere -ErrorAction SilentlyContinue |
                     ForEach-Object { "$($_.MainModule.FileVersionInfo.FileVersion) $($_.MainModule.FileName)" })
          Get-Process ScreenHere -ErrorAction SilentlyContinue | Stop-Process -Force
          $installed = "$env:LOCALAPPDATA\Programs\ScreenHere\ScreenHere.exe"
          if ($alive -ne "1.0.1.0 $installed") { throw "expected 1.0.1 installed and alone, got: $($alive -join '; ')" }
          # And the installed copy is the new one, so the next login starts it.
          $moved = (Get-Item $installed).VersionInfo.FileVersion
          if ($moved -ne '1.0.1.0') { throw "the installed copy stayed at $moved" }
          "took over, and moved in"

  # The button in the panel, against the real release on GitHub: an old build
  # installs itself, is told to update, and must come back as the new one.
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: An old build updates itself
        shell: pwsh
        env:
          # Its own folder, so the update runs without touching an installed copy.
          SCREENHERE_PROFILE: ${{ runner.temp }}\profile
        run: |
          ./windows/scripts/publish.ps1 -Version 1.0.0
          # The preview after a capture off, so the watcher never starts and
          # the classes its shutdown needs are never read out of the build:
          # with them already loaded, a swapped file goes unnoticed.
          New-Item -ItemType Directory -Force $env:SCREENHERE_PROFILE | Out-Null
          '{ "PreviewOnCapturedScreen": false, "Greeted": true }' |
            Set-Content "$env:SCREENHERE_PROFILE\settings.json"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\old" | Out-Null
          $exe = "$env:RUNNER_TEMP\old\ScreenHere.exe"
          Copy-Item windows/dist/ScreenHere-Windows.exe $exe

          Start-Process $exe; Start-Sleep 20
          "--- before: " + ((Get-Process ScreenHere -ErrorAction SilentlyContinue).MainModule.FileVersionInfo.FileVersion -join ', ')
          Start-Process $exe -ArgumentList '--do', 'update'
          # Seventy megabytes, then the swap and the relaunch.
          Start-Sleep 90

          foreach ($log in 'update.log', 'errors.log') {
            $path = "$env:SCREENHERE_PROFILE\$log"
            if (Test-Path $path) { "--- $log"; Get-Content $path }
          }
          Get-ChildItem "$env:RUNNER_TEMP\old" | ForEach-Object { "    $($_.Name)  $($_.Length)" }

          $alive = @(Get-Process ScreenHere -ErrorAction SilentlyContinue |
                     ForEach-Object { $_.MainModule.FileVersionInfo.FileVersion })
          "--- after: $($alive -join ', ')"
          Get-Process ScreenHere -ErrorAction SilentlyContinue | Stop-Process -Force
          $latest = (Invoke-RestMethod 'https://api.github.com/repos/adrbn/screenhere/releases/latest').tag_name.TrimStart('v')
          if ($alive -notcontains "$latest.0") { throw "updating left $($alive -join ', '), not $latest" }
          # And it updated by updating, not by the newer copy taking over from
          # a copy that fell over on its way out: that rescue hides the fault.
          if ((Get-Content "$env:SCREENHERE_PROFILE\update.log" -Raw) -match 'failed:') {
            throw "the update went through its error path"
          }
          "updated to $latest"
